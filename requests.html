</head>
<body>

<!-- SIDEBAR -->

		</a>

			<li>
				<a href="index.html">
					<i class='bx bxs-dashboard' ></i>
					<span class="text">Dashboard</span>
				</a>
			</li>
            <li>
				<a href="reports.html">
					<i class='bx bxs-message-dots' ></i>

				</a>
			</li>
			<li>

			<li>

			</li>
			<li>

					<i class='bx bxs-bar-chart-alt-2' ></i>

			</li>
            <li>

					<i class='bx bxs-calendar' ></i>

				</a>

		</ul>
		<ul class="side-menu">
			<li>

		</ul>
	</section>
	<!-- SIDEBAR -->

	<!-- CONTENT -->
	<section id="content">
		<!-- NAVBAR - Copy this entire section to all your HTML pages -->
<nav>
    <!-- Menu Toggle Button -->
    <i class='bx bx-menu'></i>
    
    <!-- Search Form -->
    <form action="#">
        <div class="form-input">
            <input type="search" placeholder="Search...">
            <button type="submit" class="search-btn">
                <i class='bx bx-search'></i>
            </button>
        </div>
    </form>
    
    <!-- Dark/Light Mode Toggle -->
    <i class='bx bx-sun' id="sun-icon"></i>
    <input type="checkbox" id="switch-mode" hidden>
    <label for="switch-mode" class="switch-mode"></label>
    <i class='bx bx-moon' id="moon-icon"></i>
    
    <!-- Notification Icon -->
    <a href="notif.html" class="notification">
        <i class='bx bxs-bell'></i>
        <span class="num"></span>
    </a>
    
    <!-- Profile Icon -->
    <a href="profile.html" class="profile">
        <img src="IMAGES/" id="navbar-profile-img" alt="Profile">
    </a>
</nav>
<!-- END NAVBAR -->

        <!-- REQUESTS SECTION -->
        <div class="reports-section">
            <h2>Requests</h2>
            <div class="table-wrapper">
                <table id="requests-table">
                    <thead>
                        <tr>
                            <th>Request ID</th>
                            <th>Type</th>
                            <th>Requested By</th>
                            <th>Role</th>
                            <th>Details</th>
                            <th>Date Requested</th>
                            <th>Status</th>
                            <th>Action</th>
                        </tr>
                    </thead>
                    <tbody></tbody>
                </table>
            </div>
        </div>
    </section>
	<!-- CONTENT -->

	<!-- FLOATING SCANNER BUTTON -->
<button class="floating-scanner-btn" id="scannerBtn">
    <i class='bx bx-qr-scan'></i>
</button>

<!-- REGISTRATION MODAL -->
<div class="modal-overlay" id="modalOverlay">
    <div class="modal-content">
        <button class="modal-close" id="modalClose">
            <i class='bx bx-x'></i>
        </button>
        
        <div class="modal-header">
            <h2>Register New Livestock</h2>
        </div>

        <form class="registration-form" id="registrationForm">
            <div class="form-group">
                <label>Kind of Live Food</label>
                <input type="text" id="liveFood" placeholder="e.g., Pig, Cattle, Carabao" required>
            </div>

            <div class="form-group">
                <label>Weight (Kilogram)</label>
                <div class="weight-input">
                    <input type="number" id="weight" step="0.1" min="0" value="0.0" required>
                    <div class="weight-controls">
                        <button type="button" class="weight-btn" id="weightUp">
                            <i class='bx bx-chevron-up'></i>
                        </button>
                        <button type="button" class="weight-btn" id="weightDown">
                            <i class='bx bx-chevron-down'></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="form-group">
                <label>Gender</label>
                <div class="gender-select">
                    <button type="button" class="gender-btn" data-gender="male">
                        <i class='bx bx-male-sign'></i>
                        <span>Male</span>
                    </button>
                    <button type="button" class="gender-btn" data-gender="female">
                        <i class='bx bx-female-sign'></i>
                        <span>Female</span>
                    </button>
                </div>
                <input type="hidden" id="gender" required>
            </div>

            <div class="form-group">
                <label>Livestock ID</label>
                <div class="id-input">
                    <input type="text" id="livestockId" placeholder="Scan QR Code" readonly required>
                    <button type="button" class="scan-qr-btn" id="scanQrBtn">
                        <i class='bx bx-qr-scan'></i>
                        <span>Scan QR</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <label>Dealer Name</label>
                <input type="text" id="dealerName" placeholder="Enter dealer name" required>
            </div>

            <button type="submit" class="submit-btn">
                <i class='bx bx-check'></i>
                Register Livestock
            </button>
        </form>
    </div>
</div>

<!-- QR SCANNER MODAL -->
<div class="qr-modal-overlay" id="qrModalOverlay">
    <div class="qr-modal-content">
        <button class="modal-close" id="qrModalClose">
            <i class='bx bx-x'></i>
        </button>
        
        <div class="qr-modal-header">
            <h2>Scan QR Code</h2>
        </div>

        <div class="qr-scanner-container">
            <video id="qrVideo" autoplay></video>
            <div class="qr-overlay">
                <div class="qr-frame"></div>
            </div>
        </div>

        <div class="qr-instructions">
            <p>Position the QR code within the frame</p>
        </div>
    </div>
</div>

    <script src="script.js"></script>
	<script src="notification.js"></script>
    <script src="requests.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Boxicons -->
    <link href='https://unpkg.com/boxicons@2.0.9/css/boxicons.min.css' rel='stylesheet'>
    <!-- My CSS -->
    <link rel="stylesheet" href="dealer_style.css">
    <link rel="stylesheet" href="dealer_history.css">

    <!-- Prevent dark mode flicker -->
    <script>
        (function() {
            if (localStorage.getItem('darkMode') === 'enabled') {
                document.documentElement.classList.add('dark-init');
                document.body.classList.add('dark');
            }
        })();
    </script>

    <title>PSMO - History</title>
</head>
<body>

    <!-- SIDEBAR -->
    <section id="sidebar">
        <a href="dealer_index.html" class="brand">
            <img src="IMAGES/PSMO.png" class="logo">
            <span class="text">Dealer</span>
        </a>
        <ul class="side-menu top">
            <li>
                <a href="dealer_index.html">
                    <i class='bx bxs-dashboard'></i>
                    <span class="text">Dashboard</span>
                </a>
            </li>
            <li>
                <a href="dealer_livestock.html">
                    <i class='bx bxs-box'></i>
                    <span class="text">My Livestock</span>
                </a>
            </li>
            <li class="active">
                <a href="dealer_history.html">
                    <i class='bx bxs-time'></i>
                    <span class="text">History</span>
                </a>
            </li>
        </ul>
        <ul class="side-menu">
            <li>
                <a href="dealer_sign.html" class="logout">
                    <i class='bx bxs-log-out-circle'></i>
                    <span class="text">Logout</span>
                </a>
            </li>
        </ul>
    </section>
    <!-- SIDEBAR -->

    <!-- CONTENT -->
    <section id="content">
        <!-- NAVBAR -->
        <nav>
            <i class='bx bx-menu'></i>
            <form action="#">
                <div class="form-input">
                    <input type="search" placeholder="Search history..." id="searchInput">
                    <button type="submit" class="search-btn"><i class='bx bx-search'></i></button>
                </div>
            </form>
            <i class='bx bx-sun' id="sun-icon"></i>
            <input type="checkbox" id="switch-mode" hidden>
            <label for="switch-mode" class="switch-mode"></label>
            <i class='bx bx-moon' id="moon-icon"></i>
            <a href="dealer_profile.html" class="profile">
                <img src="IMAGES/" id="navbar-profile-img">
            </a>
        </nav>
        <!-- NAVBAR -->

        <!-- MAIN -->
        <main>
            <div class="head-title">
                <div class="left">
                    <h1>Livestock History</h1>
                    <p class="dealer-note">View all your livestock transaction history</p>
                </div>
            </div>

            <!-- FILTERS AND SUMMARY -->
            <div class="table-data">
                <div class="order full-width">
                    <div class="head">
                        <h3>Filter & Summary</h3>
                    </div>
                    
                    <div class="date-filter">
                        <div class="date-input-group">
                            <label>From Date:</label>
                            <input type="date" id="dateFrom">
                        </div>
                        <div class="date-input-group">
                            <label>To Date:</label>
                            <input type="date" id="dateTo">
                        </div>
                        <div class="date-input-group">
                            <label>Status:</label>
                            <select id="statusFilter" class="status-filter">
                                <option value="all">All Status</option>
                                <option value="In Entry Point">Entry Point</option>
                                <option value="In Holding Pen">Holding Pen</option>
                                <option value="In Slaughter House">Slaughter House</option>
                                <option value="In Exit Point">Exit Point</option>
                                <option value="Anomaly Detected">Anomaly</option>
                            </select>
                        </div>
                        <button class="filter-btn" id="applyFilter">
                            <i class='bx bx-filter'></i> Apply Filter
                        </button>
                        <button class="clear-filter-btn filter-btn" id="clearFilter">
                            <i class='bx bx-x'></i> Clear
                        </button>
                    </div>

                    <div class="history-summary" id="historySummary">
                        <div class="summary-item">
                            <label>Total Records</label>
                            <div class="value" id="totalRecords">0</div>
                        </div>
                        <div class="summary-item">
                            <label>Total Weight (kg)</label>
                            <div class="value" id="totalWeight">0</div>
                        </div>
                        <div class="summary-item">
                            <label>Completed</label>
                            <div class="value" id="completedCount">0</div>
                        </div>
                        <div class="summary-item">
                            <label>Anomalies</label>
                            <div class="value" id="anomalyCount">0</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- VIEW TOGGLE -->
            <div class="table-data">
                <div class="order full-width">
                    <div class="head">
                        <h3>History Records</h3>
                        <div class="filter-group">
                            <div class="view-toggle">
                                <button id="tableViewBtn" class="active">
                                    <i class='bx bx-table'></i> Table View
                                </button>
                                <button id="timelineViewBtn">
                                    <i class='bx bx-time'></i> Timeline View
                                </button>
                            </div>
                            <button class="export-btn" id="exportBtn">
                                <i class='bx bx-download'></i> Export CSV
                            </button>
                        </div>
                    </div>

                    <!-- TABLE VIEW -->
                    <div id="tableView" class="table-view active">
                        <table>
                            <thead>
                                <tr>
                                    <th>Livestock ID</th>
                                    <th>Type</th>
                                    <th>Weight (kg)</th>
                                    <th>Gender</th>
                                    <th>Status</th>
                                    <th>Date Submitted</th>
                                    <th>Last Updated</th>
                                    <th>Action</th>
                                </tr>
                            </thead>
                            <tbody id="history-tbody">
                                <!-- History will be loaded here dynamically -->
                            </tbody>
                        </table>
                    </div>

                    <!-- TIMELINE VIEW -->
                    <div id="timelineView" class="timeline-view">
                        <!-- Timeline will be loaded here dynamically -->
                    </div>

                    <div class="empty-state" id="emptyState" style="display: none;">
                        <i class='bx bx-time'></i>
                        <p>No history records found.</p>
                    </div>
                </div>
            </div>
        </main>
        <!-- MAIN -->
    </section>
    <!-- CONTENT -->

    <!-- DETAILS MODAL -->
    <div class="modal-overlay" id="detailsModalOverlay">
        <div class="modal-content">
            <button class="modal-close" id="detailsModalClose">
                <i class='bx bx-x'></i>
            </button>
            
            <div class="modal-header">
                <h2>Livestock Details</h2>
            </div>

            <div class="details-content" id="detailsContent">
                <!-- Details will be loaded here -->
            </div>
        </div>
    </div>

    <script src="dealer_script.js"></script>
    <script src="dealer_history.js"></script>
</body>
</html>
